[package]
name = "zamin-kernel"
version = "0.0.31"
edition = "2024"
authors = ["Abbosjon Dev <info@zamin.app>"]
homepage = "https://zamin.app"
description = "Zamin OS — Rust tilida noldan yozilgan ARM64 operatsion tizimi"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Ataylab böş: hamma narsani özimiz yozamiz.

[profile.dev]
panic = "abort"
# Kriptografiya (PBKDF2, ChaCha20) optimallaştirişsiz juda sekin; tekşiruvlar
# (overflow-checks, debug_assert) va debug maʼlumoti saqlanib qoladi.
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 3
# To'liq (fat) LTO JS interpretatorining eval/call ni bir-biriga inline qilib, har bir JS
# çaqiruvi ~4.5 KiB stek olardi va 60 KiB yadro stekida fib(15) self-testi yiqilardi
# (VPS obrazi --release bilan yuklanmasdi). Thin LTO: ~3.5 KiB, debug bilan bir xil.
lto = "thin"
