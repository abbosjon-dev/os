[package]
name = "zamin-kernel"
version = "0.0.1"
edition = "2024"
authors = ["Abbosjon Dev <info@zamin.app>"]
homepage = "https://zamin.app"
description = "Zamin OS — Rust tilida noldan yozilgan ARM64 operatsion tizimi"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Ataylab bo'sh: hamma narsani o'zimiz yozamiz.

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
