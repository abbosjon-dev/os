[package]
name = "zamin-kernel"
version = "0.0.22"
edition = "2024"
authors = ["Abbosjon Dev <info@zamin.app>"]
homepage = "https://zamin.app"
description = "Zamin OS — Rust tilida noldan yozilgan ARM64 operatsion tizimi"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Ataylab böş: hamma narsani özimiz yozamiz.

[profile.dev]
panic = "abort"
# Kriptografiya (PBKDF2, ChaCha20) optimallaştirişsiz juda sekin; tekşiruvlar
# (overflow-checks, debug_assert) va debug maʼlumoti saqlanib qoladi.
opt-level = 2

[profile.release]
panic = "abort"
opt-level = 3
lto = true
